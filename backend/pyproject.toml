[project]
name = "repo2career"
version = "0.1.0"
description = "Evidence-first repository and PDF analysis for interviews"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21.0",
  "fastapi[standard]>=0.116.0",
  "httpx[socks]>=0.28.0",
  "openai>=1.100.0",
  "pydantic>=2.11.0",
  "pypdf[crypto]>=6.0.0",
  "python-dotenv>=1.1.0",
  "python-multipart>=0.0.20",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "respx>=0.22.0",
  "ruff>=0.12.0",
]

[project.scripts]
repo2career = "repo2career.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo2career"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
